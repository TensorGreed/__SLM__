name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend phase tests (per-module isolation)
        env:
          DB_AUTO_CREATE: "true"
        run: |
          . .venv/bin/activate
          # Phase modules that DON'T pin their own DATABASE_URL fall back to the
          # committed dev DB, which is stale in a fresh checkout (predates recent
          # columns, e.g. projects.goal). The default DATABASE_URL resolves to
          # <repo-root>/data/slm_platform.db via PROJECT_ROOT regardless of CWD,
          # and this step runs in backend/, so the repo-root copy is one level
          # up. Remove it so ALLOW_SQLITE_AUTOCREATE rebuilds the current schema.
          rm -f ../data/slm_platform.db ../data/slm_platform.db-shm ../data/slm_platform.db-wal
          mapfile -t test_modules < <(ls tests/test_phase*.py | grep -v 'test_phase20_' | sed 's#/#.#g; s#.py$##')
          printf 'Discovered %s phase test modules\n' "${#test_modules[@]}"
          # 56 of these modules pin their own DATABASE_URL/DATA_DIR at import.
          # Running them in ONE unittest process collides on the single shared
          # StaticPool aiosqlite engine — only the first import's pin wins, so
          # the rest contaminate each other ("Project not found" / stale state,
          # ~100 false failures). Run each module in its own process (mirrors
          # the non-phase pytest loop below). 2 attempts tolerates the same
          # async-job/StaticPool flakiness the non-phase loop documents.
          fail=0
          for m in "${test_modules[@]}"; do
            echo "::group::$m"
            ok=0
            for attempt in 1 2; do
              if python -m unittest "$m"; then ok=1; break; fi
              echo "::warning::$m failed attempt $attempt/2"
            done
            if [ "$ok" -ne 1 ]; then echo "::error::$m failed after 2 attempts"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Run non-phase backend tests (isolated, one pytest process each)
        env:
          DB_AUTO_CREATE: "true"
        run: |
          # The phase glob above misses the probe-arc tests, the demo-reset /
          # classification-launch tests, and ~120 other non-phase files, so they
          # never gated. They're pytest-developed (conftest.py pins each run's DB
          # to a per-PID /tmp scratch), and several override DATABASE_URL at
          # import — so two in ONE pytest process collide on a single engine.
          # Run each file in its own pytest process to honour that isolation.
          . .venv/bin/activate
          pip install "pytest==9.0.2"
          mapfile -t nonphase < <(ls tests/test_*.py | grep -v 'test_phase')
          printf 'Discovered %s non-phase backend test files\n' "${#nonphase[@]}"
          fail=0
          for f in "${nonphase[@]}"; do
            echo "::group::$f"
            # Up to 3 attempts per file. A handful of async-job tests
            # (test_jobs_service's heldout/quickstart/llm-judge async endpoints)
            # are intermittently flaky: their background Job runners race with
            # the test's own requests over the single-connection StaticPool
            # aiosqlite engine ("Project N not found", ~1-in-8). Retry tolerates
            # the flake; a genuinely broken file still fails all 3 attempts.
            ok=0
            for attempt in 1 2 3; do
              if python -m pytest "$f" -q -p no:cacheprovider; then
                ok=1; break
              fi
              echo "::warning::$f failed attempt $attempt/3"
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::$f failed after 3 attempts"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  conformance-matrix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run conformance + scale matrix tests
        env:
          DB_AUTO_CREATE: "true"
        run: |
          . .venv/bin/activate
          python -m unittest tests.test_phase20_conformance_scale_matrix -v

  frontend-build:
    # Only runs when frontend/** changed (see the `changes` job).
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  changes:
    # Per-job path filtering. GitHub's top-level `on.paths:` gates the WHOLE
    # workflow, so it can't scope a single job — this tiny job diffs the push /
    # PR range and exposes a `docs` boolean that docs-build keys off. Pure git
    # (no third-party action), and fails safe (runs docs-build) when the base
    # commit is unavailable, e.g. a brand-new branch's first push.
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base commit unavailable — running every gated job to be safe."
            for n in docs frontend backend e2e; do echo "$n=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          printf 'Changed files:\n%s\n' "$changed"
          set_out() {
            if echo "$changed" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          set_out docs '^slm-docs/'
          set_out frontend '^frontend/'
          set_out backend '^backend/'
          # The golden-path E2E drives both stacks plus the root Playwright
          # harness (tests/, root package.json/lock, playwright*.config.*), so
          # any of those must re-run it. A docs-only PR matches none → it skips.
          set_out e2e '^(frontend|backend|tests)/|^package(-lock)?\.json$|^playwright[^/]*\.config\.'

  docs-build:
    # Builds the Docusaurus docs site. docusaurus.config.ts sets
    # onBrokenLinks + onBrokenAnchors to 'throw', so a broken internal link
    # or a stale #anchor fails the build here instead of silently
    # accumulating warnings (which is how three broke before this gate).
    # Only runs when slm-docs/** changed (see the `changes` job).
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slm-docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: slm-docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci

      - name: Build docs (fails on broken links/anchors)
        run: npm run build

  e2e-golden-path:
    # Locks the newbie golden path (login → sample → beginner pipeline →
    # train) against regression. Training runs on the simulate runtime
    # (no GPU on CI) — a path-integrity gate, not a quality gate.
    # Only runs when a stack or the E2E harness changed (see the `changes`
    # job's `e2e` output); a docs-only PR skips it.
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright + chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Boot stack (simulate runtime) + run golden-path E2E
        env:
          E2E_BASE_URL: http://localhost:5175
        run: |
          set -e
          # Backend: auth on (bootstraps admin), simulate training, scratch DB.
          ( cd backend && \
            DATABASE_URL="sqlite+aiosqlite:////tmp/gp.db" DATA_DIR="/tmp/gpdata" \
            AUTH_ENABLED=true API_KEY=sk-mock-admin-key AUTH_BOOTSTRAP_API_KEY=sk-mock-admin-key \
            ALLOW_SIMULATED_TRAINING=true TRAINING_BACKEND=simulate \
            ALLOW_SQLITE_AUTOCREATE=true DB_REQUIRE_ALEMBIC_HEAD=false \
            .venv/bin/uvicorn app.main:app --port 8021 --no-access-log > /tmp/be.log 2>&1 & )
          # Frontend: dev server proxying /api to the scratch backend.
          ( cd frontend && \
            VITE_API_PROXY_TARGET=http://localhost:8021 \
            npm run dev -- --port 5175 --strictPort > /tmp/fe.log 2>&1 & )
          # Wait for both to come up (curl loop — no extra deps).
          for i in $(seq 1 60); do
            curl -sf http://localhost:8021/api/health > /dev/null 2>&1 && \
            curl -sf http://localhost:5175 > /dev/null 2>&1 && break
            sleep 2
          done
          npx playwright test --config playwright.golden-path.config.ts

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-path-e2e-results
          path: |
            test-results/
            /tmp/be.log
            /tmp/fe.log
          if-no-files-found: ignore

  ci-success:
    # Single aggregate gate for branch protection. Make THIS the one required
    # status check (not the individual jobs). It always runs, so the context is
    # never "missing" — the footgun where a path-gated job that never reports
    # leaves a PR stuck at "Expected — Waiting for status to be reported".
    #
    # It passes when every job either succeeded OR was intentionally skipped
    # (path-gated), and fails only if a job actually failed or was cancelled.
    # Requiring just this one check also means the required-check list never
    # drifts as jobs are added/renamed.
    if: always()
    needs:
      - changes
      - backend-tests
      - conformance-matrix
      - frontend-build
      - docs-build
      - e2e-golden-path
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A required CI job failed or was cancelled — see the run summary."
          exit 1
      - name: All required jobs passed or were skipped
        run: echo "CI gate green — every job succeeded or was intentionally path-skipped."
